<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Top Half: Neon Cyan to Electric Azure -->
    <linearGradient id="cyanAzure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="60%" stop-color="#00BBF9" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Bottom Half: Royal Blue to Vivid Ultraviolet -->
    <linearGradient id="azureViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Center Interlocking Power Core Gradient -->
    <linearGradient id="coreGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Outer Squircle Frame Border -->
    <linearGradient id="frameBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <style>
    @keyframes cyberPulse {
      0%, 100% {
        filter: drop-shadow(0 0 10px rgba(0, 245, 212, 0.45));
      }
      50% {
        filter: drop-shadow(0 0 24px rgba(168, 85, 247, 0.7));
      }
    }
    @keyframes innerGlow {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }
    .glyph-group {
      animation: cyberPulse 4s ease-in-out infinite;
    }
    .center-joint {
      animation: innerGlow 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Dark Obsidian Container -->
  <rect width="512" height="512" rx="124" fill="#060913" />
  <rect width="496" height="496" x="8" y="8" rx="116" stroke="url(#frameBorder)" stroke-width="12" />

  <!-- The "S" Geometric Emblem -->
  <g class="glyph-group">
    <!-- Top "S" Wing & Sweep -->
    <path
      d="M 372 135 H 210 C 160 135 125 170 125 220 C 125 260 155 285 205 300 L 290 325"
      stroke="url(#cyanAzure)"
      stroke-width="52"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Bottom "S" Wing & Sweep -->
    <path
      d="M 222 287 L 307 312 C 357 327 387 352 387 392 C 387 442 352 477 302 477 H 140"
      stroke="url(#azureViolet)"
      stroke-width="52"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Center Precision Diamond Focus Node -->
    <polygon
      class="center-joint"
      points="256,220 292,256 256,292 220,256"
      fill="url(#coreGlow)"
    />
  </g>
</svg>
