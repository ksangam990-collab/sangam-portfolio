<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Cyan to Royal Blue Gradient -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Indigo to Violet Gradient -->
    <linearGradient id="blueViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Dark Obsidian Squircle Base (Ensures crisp contrast on dark & light tabs) -->
  <rect width="512" height="512" rx="120" fill="#060913" />
  <rect width="500" height="500" x="6" y="6" rx="114" fill="none" stroke="url(#borderShine)" stroke-width="12" />

  <!-- Modern Sharp Geometric 'S' Monogram -->
  <g>
    <!-- Upper Wing (Electric Cyan to Blue) -->
    <path
      d="M 140 144 H 372 V 224 H 268 L 332 278 H 244 L 140 196 Z"
      fill="url(#cyanBlue)"
    />

    <!-- Lower Wing (Blue to Electric Violet) -->
    <path
      d="M 372 368 H 140 V 288 H 244 L 180 234 H 268 L 372 316 Z"
      fill="url(#blueViolet)"
    />

    <!-- Central Precision Diamond Core -->
    <polygon
      points="256,230 286,256 256,282 226,256"
      fill="#00F5D4"
      opacity="0.9"
    />
  </g>
</svg>
