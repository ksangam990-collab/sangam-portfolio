<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="meshCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="meshViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Dark Base Squircle -->
  <rect width="512" height="512" rx="124" fill="#05070D" />
  <rect width="496" height="496" x="8" y="8" rx="116" stroke="url(#glowBorder)" stroke-width="12" />

  <!-- 3D Perspective Wireframe S Lattice -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Top 3D Hull Facet -->
    <polygon points="170,140 342,140 382,185 210,185" fill="#00F5D4" fill-opacity="0.25" stroke="url(#meshCyan)" stroke-width="8" />
    <!-- Top-Right 3D Descending Arm -->
    <polygon points="342,140 382,185 342,260 302,215" fill="#3B82F6" fill-opacity="0.3" stroke="url(#meshCyan)" stroke-width="8" />
    <!-- Center 3D Diagonal Bridge -->
    <polygon points="302,215 342,260 210,315 170,270" fill="#6366F1" fill-opacity="0.35" stroke="url(#meshViolet)" stroke-width="8" />
    <!-- Bottom-Left 3D Ascending Pillar -->
    <polygon points="170,270 210,315 170,390 130,345" fill="#8B5CF6" fill-opacity="0.3" stroke="url(#meshViolet)" stroke-width="8" />
    <!-- Bottom 3D Foundation Facet -->
    <polygon points="170,390 342,390 302,345 130,345" fill="#A855F7" fill-opacity="0.25" stroke="url(#meshViolet)" stroke-width="8" />

    <!-- 3D Lattice Node Joints -->
    <circle cx="170" cy="140" r="10" fill="#00F5D4" />
    <circle cx="342" cy="140" r="10" fill="#00F5D4" />
    <circle cx="382" cy="185" r="10" fill="#3B82F6" />
    <circle cx="210" cy="185" r="10" fill="#00F5D4" />
    <circle cx="342" cy="260" r="10" fill="#6366F1" />
    <circle cx="170" cy="270" r="10" fill="#6366F1" />
    <circle cx="210" cy="315" r="10" fill="#8B5CF6" />
    <circle cx="130" cy="345" r="10" fill="#A855F7" />
    <circle cx="302" cy="345" r="10" fill="#A855F7" />
    <circle cx="170" cy="390" r="10" fill="#A855F7" />
    <circle cx="342" cy="390" r="10" fill="#A855F7" />
  </g>
</svg>
